<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiếng Anh 7 - Tổng Ôn Units 1, 2, 3 - Ms Ngoc Hai FTU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-bg-1: #8854C0;
            --primary-bg-2: #FDCB6E;
            --primary-bg-3: #00C9A7;
            --primary-bg-4: #FF7675;
            --correct-color: #00D26A;
            --correct-shadow: #00A352;
            --wrong-color: #FF4757;
            --wrong-shadow: #D63031;
            --selected-color: #6C5CE7;
            --selected-shadow: #4834D4;
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-color: #2D3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #8854C0, #FDCB6E, #00C9A7, #FF7675, #6C5CE7);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: relative;
            padding: 20px 10px;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* SVG Floating Pattern Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><text x="15" y="35" font-size="22" opacity="0.35">⭐</text><text x="75" y="25" font-size="24" opacity="0.35">🌸</text><text x="95" y="85" font-size="20" opacity="0.35">🍓</text><text x="25" y="95" font-size="24" opacity="0.35">🐱</text><text x="60" y="60" font-size="22" opacity="0.35">☁️</text></svg>');
            background-repeat: repeat;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 860px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            border: 3px solid #FFF;
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 900;
            color: #6C5CE7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .teacher-tag {
            font-size: 0.82rem;
            font-weight: 800;
            color: #D63031;
            background: #FFEAA7;
            display: inline-block;
            padding: 2px 12px;
            border-radius: 10px;
            border: 2px solid #FDCB6E;
            margin-top: 4px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FFF;
            padding: 12px 20px;
            border-radius: 18px;
            box-shadow: 0 5px 0px #DFE6E9;
            font-weight: 800;
            font-size: 0.95rem;
        }

        .progress-container {
            flex-grow: 1;
            margin: 0 15px;
            background: #DFE6E9;
            height: 14px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00C9A7, #00D26A);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .filter-bar {
            display: none;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-bar.active {
            display: flex;
        }

        .filter-btn {
            background: #FFF;
            border: 3px solid #CBD5E1;
            border-bottom: 5px solid #94A3B8;
            border-radius: 14px;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 800;
            color: #475569;
            cursor: pointer;
        }

        .filter-btn.active {
            background: #6C5CE7;
            border-color: #6C5CE7;
            border-bottom-color: #4834D4;
            color: #FFF;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid #FFF;
            transition: transform 0.2s, opacity 0.3s;
        }

        .question-card.hidden {
            display: none;
        }

        .card-header-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge-group {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .question-number {
            font-size: 0.85rem;
            font-weight: 800;
            color: #0984E3;
            background: #E1F5FE;
            padding: 3px 10px;
            border-radius: 10px;
        }

        .level-indicator {
            font-size: 0.78rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .level-easy { background: #E8F5E9; color: #2E7D32; }
        .level-med { background: #FFF3E0; color: #EF6C00; }
        .level-hard { background: #FFEBEE; color: #C62828; }

        .type-badge {
            font-size: 0.78rem;
            font-weight: 800;
            background: #F1F5F9;
            color: #475569;
            padding: 3px 8px;
            border-radius: 8px;
        }

        .status-badge {
            display: none;
            font-size: 0.82rem;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 10px;
        }

        .status-badge.correct {
            display: inline-block;
            background: #D1FAE5;
            color: #059669;
        }

        .status-badge.wrong {
            display: inline-block;
            background: #FEE2E2;
            color: #DC2626;
        }

        .question-text {
            font-size: 1.08rem;
            font-weight: 700;
            color: #2D3436;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .gap-slot {
            display: inline-block;
            min-width: 90px;
            padding: 2px 8px;
            border-bottom: 3px dashed #6C5CE7;
            color: #6C5CE7;
            font-weight: 900;
            text-align: center;
            background: #F3E8FF;
            border-radius: 8px;
            margin: 0 4px;
        }

        .sale-sign-box {
            background: linear-gradient(135deg, #FF7675, #D63031);
            color: #FFF;
            padding: 14px;
            border-radius: 14px;
            border: 3px dashed #FFF;
            text-align: center;
            font-weight: 900;
            margin-bottom: 14px;
            box-shadow: 0 4px 12px rgba(255, 118, 117, 0.4);
            font-size: 0.98rem;
        }

        .phone-message-box {
            background: #E8F5E9;
            border: 2px solid #00C9A7;
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 10px rgba(0, 201, 167, 0.15);
        }

        .phone-icon { font-size: 1.8rem; }
        .phone-text { font-size: 0.95rem; font-weight: 800; color: #059669; }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 10px;
        }

        .option-btn {
            background: #FFFFFF;
            border: 3px solid #E2E8F0;
            border-bottom: 6px solid #CBD5E1;
            border-radius: 16px;
            padding: 12px 14px;
            font-size: 0.98rem;
            font-weight: 800;
            color: #475569;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            outline: none;
        }

        .option-btn:hover:not(.locked) {
            transform: translateY(-2px);
            border-color: #C7D2FE;
            background: #F5F3FF;
        }

        .option-btn:active:not(.locked) {
            transform: translateY(2px);
            border-bottom-width: 3px;
        }

        .option-prefix {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: #F1F5F9;
            color: #64748B;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: 900;
            flex-shrink: 0;
        }

        .option-btn.selected {
            background-color: var(--selected-color) !important;
            border-color: var(--selected-color) !important;
            border-bottom-color: var(--selected-shadow) !important;
            color: #FFFFFF !important;
        }

        .option-btn.selected .option-prefix {
            background: rgba(255, 255, 255, 0.3);
            color: #FFF;
        }

        .option-btn.correct {
            background-color: var(--correct-color) !important;
            border-color: var(--correct-color) !important;
            border-bottom-color: var(--correct-shadow) !important;
            color: #FFFFFF !important;
        }

        .option-btn.correct .option-prefix { background: rgba(255, 255, 255, 0.3); color: #FFF; }

        .option-btn.wrong {
            background-color: var(--wrong-color) !important;
            border-color: var(--wrong-color) !important;
            border-bottom-color: var(--wrong-shadow) !important;
            color: #FFFFFF !important;
        }

        .option-btn.wrong .option-prefix { background: rgba(255, 255, 255, 0.3); color: #FFF; }

        .explanation-box {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: #F0FDF4;
            border: 2px dashed #00C9A7;
            border-radius: 16px;
            animation: fadeIn 0.4s ease-out;
        }

        .explanation-box.active { display: block; }

        .explanation-title {
            font-size: 0.98rem;
            font-weight: 900;
            color: #059669;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            border-bottom: 2px solid #A7F3D0;
            padding-bottom: 4px;
        }

        .exp-section { margin-bottom: 6px; font-size: 0.9rem; line-height: 1.5; }
        .exp-section strong { color: #065F46; }

        .exp-options-list { list-style: none; margin: 4px 0; padding-left: 6px; }
        .exp-options-list li { margin-bottom: 3px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shake-card {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .submit-btn-container { text-align: center; margin: 10px 0 30px; }

        .submit-btn {
            background: linear-gradient(180deg, #FF7675 0%, #D63031 100%);
            color: white;
            font-size: 1.15rem;
            font-weight: 900;
            padding: 14px 34px;
            border: none;
            border-radius: 22px;
            box-shadow: 0 7px 0 #B22222, 0 10px 18px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 9px 0 #B22222, 0 12px 22px rgba(0,0,0,0.25); }
        .submit-btn:active { transform: translateY(3px); box-shadow: 0 4px 0 #B22222, 0 5px 8px rgba(0,0,0,0.2); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; animation: fadeIn 0.3s ease; }

        .modal-card {
            background: #FFF;
            border-radius: 26px;
            padding: 28px 18px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 6px solid #FDCB6E;
        }

        .modal-icon { font-size: 3.5rem; margin-bottom: 6px; }
        .modal-title { font-size: 1.4rem; font-weight: 900; color: #6C5CE7; margin-bottom: 6px; }
        .score-display { font-size: 2.5rem; font-weight: 900; color: #00C9A7; margin: 8px 0; }
        .feedback-text { font-size: 0.98rem; font-weight: 700; color: #2D3436; margin-bottom: 18px; line-height: 1.45; }

        .modal-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

        .modal-btn {
            border: none;
            padding: 10px 18px;
            font-size: 0.92rem;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .modal-btn:hover { transform: translateY(-2px); }
        .btn-view-all { background: #00C9A7; color: #FFF; box-shadow: 0 4px 0 #00A352; }
        .btn-view-wrong { background: #FF7675; color: #FFF; box-shadow: 0 4px 0 #D63031; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Tiếng Anh 7 - Ôn Tập Giữa Kỳ 1 (Units 1, 2, 3)</h1>
            <div class="teacher-tag">Giáo viên tạo: Ms Ngoc Hai FTU</div>
        </header>

        <div class="stats-bar">
            <span id="statsLabel">📝 Tiến độ bài làm</span>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <span id="progressText">0/50</span>
        </div>

        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" id="btnFilterAll" onclick="filterQuestionsResult('all')">👁️ Xem toàn bộ câu hỏi (<span id="totalVisibleCount">50</span>)</button>
            <button class="filter-btn" id="btnFilterWrong" onclick="filterQuestionsResult('wrong')">❌ Chỉ xem câu làm sai (<span id="wrongCount">0</span>)</button>
        </div>

        <div id="quizContainer"></div>

        <div class="submit-btn-container" id="submitContainer">
            <button class="submit-btn" id="submitBtn">🎉 Nộp Bài & Chấm Điểm</button>
        </div>
    </div>

    <!-- Modal Score Popup -->
    <div class="modal-overlay" id="scoreModal">
        <div class="modal-card">
            <div class="modal-icon" id="modalIcon">🏆</div>
            <div class="modal-title" id="modalTitle">Kết Quả Bài Thi!</div>
            <div class="score-display" id="scoreDisplay">0/50</div>
            <div class="feedback-text" id="feedbackText">Chúc mừng bạn!</div>
            <div class="modal-actions">
                <button class="modal-btn btn-view-wrong" onclick="reviewWrongAnswers()">🔍 Xem lại câu sai</button>
                <button class="modal-btn btn-view-all" onclick="reviewAllAnswers()">📖 Xem toàn bộ lời giải chi tiết</button>
            </div>
        </div>
    </div>

    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playSound(type) {
            try {
                initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                if (type === 'correct') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'wrong') {
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.setValueAtTime(250, now + 0.12);
                    osc.frequency.setValueAtTime(200, now + 0.24);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(now + 0.4);
                }
            } catch (e) { console.log("Audio API Error"); }
        }

        const rawQuestionsData = [
            // LEVEL EASY (1-18)
            {
                level: "easy",
                levelLabel: "Dễ",
                typeLabel: "Multiple Choice",
                q: "My sister enjoys ______ cartoons in her free time.",
                options: ["watching", "watch", "to watch", "watches"],
                answer: "watching",
                exp: {
                    translations: ["A. watching (v-ing): xem", "B. watch (v): xem", "C. to watch (to-v): xem", "D. watches (v-s): xem"],
                    sentenceTrans: "Chị gái tôi thích xem phim hoạt hình vào thời gian rảnh rỗi.",
                    whyCorrect: "Chọn A vì sau động từ chỉ sở thích 'enjoy' ta phải dùng động từ dạng V-ing (enjoy + V-ing).",
                    whyWrong: "B, C, D sai dạng động từ sau 'enjoy'."
                }
            },
            {
                level: "easy",
                levelLabel: "Dễ",
                typeLabel: "Multiple Choice",
                q: "Which word has the underlined part pronounced differently?",
                options: ["l<u>ea</u>rn", "t<u>ea</u>cher", "r<u>ea</u>d", "m<u>ea</u>t"],
                answer: "l<u>ea</u>rn",
                exp: {
                    translations: ["A. learn /l3ːn/ (âm /3ː/)", "B. teacher /ˈtiːtʃər/ (âm /iː/)", "C. read /riːd/ (âm /iː/)", "D. meat /miːt/ (âm /iː/)"],
                    sentenceTrans: "Từ nào có phần gạch chân được phát âm khác với các từ còn lại?",
                    whyCorrect: "Chọn A vì phần gạch chân phát âm là /3ː/, các từ còn lại phát âm là /iː/.",
                    whyWrong: "B, C, D đều phát âm phần gạch chân là /iː/."
                }
            },
            {
                level: "easy",
                levelLabel: "Dễ",
                typeLabel: "Multiple Choice",
                q: "My cousin is addicted to ______ computer games.",
                options: ["playing", "play", "to play", "plays"],
                answer: "playing",
                exp: {
                    translations: ["A. playing (v-ing): chơi", "B. play (v): chơi", "C. to play (to-v): chơi", "D. plays (v-s): chơi"],
                    sentenceTrans: "Anh họ tôi nghiện chơi trò chơi điện tử trên máy tính.",
                    whyCorrect: "Chọn A vì cấu trúc 'be addicted to + V-ing/N' có nghĩa là nghiện làm việc gì.",
                    whyWrong: "B, C, D sai dạng động từ đi theo sau cấu trúc 'be addicted to'."
                }
            },
            {
                level: "easy",
                levelLabel: "Dễ",
                typeLabel: "Gap Fill",
                q: "Mai <span class='gap-slot' id='gap-1'>[ ? ]</span> collecting stamps. She has over 300 stamps in her album.",
                options: ["loves", "love", "is love", "loving"],
                answer: "loves",
                gapId: "gap-1",
                exp: {
                    translations: ["A. loves (v-s): yêu thích", "B. love (v): yêu thích", "C. is love: sai ngữ pháp", "D. loving: dạng v-ing"],
                    sentenceTrans: "Mai rất thích sưu tầm tem. Cô ấy có hơn 300 con tem trong cuốn sưu tập.",
                    whyCorrect: "Chọn A vì chủ ngữ 'Mai' là ngôi thứ ba số ít nên động từ ở thì hiện tại đơn phải thêm -s (loves).",
                    whyWrong: "B dùng cho chủ ngữ số nhiều. C và D cấu trúc ngữ pháp sai."
                }
            },
            {
                level: "easy",
                levelLabel: "Dễ",
                typeLabel: "Multiple Choice",
                q: "Which word has the ending -ed pronounced /ɪd/?",
                options: ["visited", "helped", "watched", "played"],
                answer: "visited",
                exp: {
                    translations: ["A. visited /ˈvɪz.ɪ.tɪd/ (âm /ɪd/)", "B. helped /helpt/ (âm /t/)", "C. watched /wɒtʃt/ (âm /t/)", "D. played /pleɪd/ (âm /d/)"],
                    sentenceTrans: "Từ nào có đuôi -ed được phát âm là /ɪd/?",
                    whyCorrect: "Chọn A vì động từ tận cùng bằng âm /t/ (visit) khi thêm -ed sẽ phát âm là /ɪd/.",
                    whyWrong: "B và C tận cùng bằng âm vô thanh nên đuôi -ed phát âm là /t/. D đuôi -ed phát âm là /d/."
                }
            },
            {
                level: "easy",
                levelLabel: "Dễ",
                typeLabel: "Multiple Choice",
                q: "My brother detests ______ in long queues at the supermarket.",
                options: ["waiting", "wait", "to wait", "waits"],
                answer: "waiting",
                exp: {
                    translations: ["A. waiting (v-ing): chờ đợi", "B. wait (v): chờ đợi", "C. to wait (to-v): chờ đợi", "D. waits (v-s): chờ đợi"],
                    sentenceTrans: "Anh trai tôi cực kỳ ghét phải xếp hàng dài ở siêu thị.",
                    whyCorrect: "Chọn A vì động từ 'detest' (căm ghét) bắt buộc theo sau bởi V-ing (detest + V-ing).",

                    whyCorrect: "Chọn A vì cấu trúc đưa ra lời khuyên 'It is a good idea to V' tương đương với 'S + should + V' (ai đó nên làm gì).",
                    whyWrong: "B, C, D mang nghĩa phủ định/tiêu cực trái ngược với câu gốc."
                }
            }
        ];

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        let userAnswers = {};
        let shuffledQuestions = [];
        let isSubmitted = false;

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';
            userAnswers = {};
            isSubmitted = false;

            const shuffledRaw = shuffleArray(rawQuestionsData);

            shuffledQuestions = shuffledRaw.map((item, index) => {
                const shuffledOpts = shuffleArray(item.options);
                return {
                    ...item,
                    displayIndex: index + 1,
                    shuffledOpts: shuffledOpts
                };
            });

            shuffledQuestions.forEach((qData, qIndex) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `question-${qIndex}`;

                const cardHeader = document.createElement('div');
                cardHeader.className = 'card-header-badge';

                const badgeGroup = document.createElement('div');
                badgeGroup.className = 'badge-group';

                const qNum = document.createElement('div');
                qNum.className = 'question-number';
                qNum.innerText = `Câu ${qIndex + 1} / ${shuffledQuestions.length}`;

                const levelTag = document.createElement('div');
                levelTag.className = `level-indicator level-${qData.level}`;
                levelTag.innerText = qData.levelLabel;

                const typeTag = document.createElement('div');
                typeTag.className = 'type-badge';
                typeTag.innerText = qData.typeLabel;

                badgeGroup.appendChild(qNum);
                badgeGroup.appendChild(levelTag);
                badgeGroup.appendChild(typeTag);

                const statusBadge = document.createElement('div');
                statusBadge.className = 'status-badge';
                statusBadge.id = `badge-${qIndex}`;

                cardHeader.appendChild(badgeGroup);
                cardHeader.appendChild(statusBadge);

                let visualHtml = '';
                if (qData.hasCustomVisual === 'saleSign') {
                    visualHtml = `
                        <div class="sale-sign-box">
                            📌 NOTICE BOARD<br>
                            <span style="font-size:1.1rem; text-decoration:underline;">CHILDREN ONLY WITH PARENTS</span>
                        </div>
                    `;
                } else if (qData.hasCustomVisual === 'phoneMessage') {
                    visualHtml = `
                        <div class="phone-message-box">
                            <div class="phone-icon">💬</div>
                            <div class="phone-text">
                                <strong>Doctor Advice:</strong> "You have a light fever. Make sure to stay warm and get plenty of rest today!"
                            </div>
                        </div>
                    `;
                }

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = visualHtml + qData.q;

                const optsGrid = document.createElement('div');
                optsGrid.className = 'options-grid';

                const prefixes = ['A', 'B', 'C', 'D'];

                qData.shuffledOpts.forEach((opt, optIdx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.id = `opt-${qIndex}-${optIdx}`;
                    btn.onclick = () => handleSelectAnswer(qIndex, opt, btn, qData.gapId);

                    const prefix = document.createElement('span');
                    prefix.className = 'option-prefix';
                    prefix.innerText = prefixes[optIdx];

                    const textSpan = document.createElement('span');
                    textSpan.innerHTML = opt;

                    btn.appendChild(prefix);
                    btn.appendChild(textSpan);
                    optsGrid.appendChild(btn);
                });

                const expBox = document.createElement('div');
                expBox.className = 'explanation-box';
                expBox.id = `explanation-${qIndex}`;

                expBox.innerHTML = `
                    <div class="explanation-title">
                        💡 PHẦN GIẢI THÍCH CHI TIẾT (Ms Ngoc Hai FTU)
                    </div>
                    <div class="exp-section">
                        <strong>1. Phân tích từ vựng/ngữ pháp 4 đáp án:</strong>
                        <ul class="exp-options-list">
                            ${qData.exp.translations.map(t => `<li>${t}</li>`).join('')}
                        </ul>
                    </div>
                    <div class="exp-section">
                        <strong>2. Dịch nghĩa toàn câu:</strong><br>
                        <em>"${qData.exp.sentenceTrans}"</em>
                    </div>
                    <div class="exp-section">
                        <strong>3. Tại sao chọn đáp án đúng?</strong><br>
                        ${qData.exp.whyCorrect}
                    </div>
                    <div class="exp-section">
                        <strong>4. Tại sao các đáp án còn lại chưa đúng?</strong><br>
                        ${qData.exp.whyWrong}
                    </div>
                `;

                card.appendChild(cardHeader);
                card.appendChild(qText);
                card.appendChild(optsGrid);
                card.appendChild(expBox);
                container.appendChild(card);
            });

            updateProgress();
            updateTotalVisibleCount();
        }

        function handleSelectAnswer(qIndex, selectedOpt, btn, gapId) {
            if (isSubmitted) return;

            const card = document.getElementById(`question-${qIndex}`);
            const buttons = card.querySelectorAll('.option-btn');

            buttons.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');

            userAnswers[qIndex] = selectedOpt;

            if (gapId) {
                const gapElement = document.getElementById(gapId);
                if (gapElement) {
                    gapElement.innerText = selectedOpt;
                }
            }

            updateProgress();
        }

        function updateProgress() {
            const answeredCount = Object.keys(userAnswers).length;
            const total = shuffledQuestions.length;
            const pct = (answeredCount / total) * 100;
            document.getElementById('progressBar').style.width = `${pct}%`;
            document.getElementById('progressText').innerText = `${answeredCount}/${total}`;
        }

        function updateTotalVisibleCount() {
            const cards = document.querySelectorAll('.question-card:not(.hidden)');
            document.getElementById('totalVisibleCount').innerText = cards.length;
        }

        document.getElementById('submitBtn').addEventListener('click', () => {
            const total = shuffledQuestions.length;
            const answeredCount = Object.keys(userAnswers).length;

            if (answeredCount < total) {
                const confirmSubmit = confirm(`Bạn mới hoàn thành ${answeredCount}/${total} câu. Bạn có muốn nộp bài ngay không?`);
                if (!confirmSubmit) return;
            }

            isSubmitted = true;
            let score = 0;
            let wrongCount = 0;

            shuffledQuestions.forEach((qData, qIndex) => {
                const card = document.getElementById(`question-${qIndex}`);
                const buttons = card.querySelectorAll('.option-btn');
                const expBox = document.getElementById(`explanation-${qIndex}`);
                const badge = document.getElementById(`badge-${qIndex}`);
                const userChoice = userAnswers[qIndex];

                buttons.forEach(b => {
                    b.classList.add('locked');
                    b.style.cursor = 'default';
                });

                const isCorrect = (userChoice === qData.answer);

                if (isCorrect) {
                    score++;
                    badge.className = 'status-badge correct';
                    badge.innerText = '✓ ĐÚNG';
                    card.dataset.result = 'correct';
                } else {
                    wrongCount++;
                    badge.className = 'status-badge wrong';
                    badge.innerText = '✗ SAI';
                    card.dataset.result = 'wrong';
                    card.classList.add('shake-card');
                }

                buttons.forEach(b => {
                    b.classList.remove('selected');
                    const textSpan = b.querySelector('span:last-child');
                    if (textSpan.innerHTML.trim() === qData.answer || textSpan.innerText.trim() === qData.answer) {
                        b.classList.add('correct');
                    } else if ((textSpan.innerHTML.trim() === userChoice || textSpan.innerText.trim() === userChoice) && !isCorrect) {
                        b.classList.add('wrong');
                    }
                });

                expBox.classList.add('active');
            });

            if (score >= total * 0.7) {
                playSound('correct');
                confetti({ particleCount: 180, spread: 90, origin: { y: 0.6 } });
            } else {
                playSound('wrong');
            }

            document.getElementById('wrongCount').innerText = wrongCount;
            document.getElementById('filterBar').classList.add('active');
            document.getElementById('statsLabel').innerText = '🎯 Kết quả kiểm tra';
            document.getElementById('submitContainer').style.display = 'none';

            document.getElementById('scoreDisplay').innerText = `${score}/${total}`;
            let feedback = "";
            let icon = "🏆";
            if (score === total) {
                feedback = "XUẤT SẮC TUYỆT ĐỐI! Bạn đã làm đúng toàn bộ 50 câu Units 1, 2, 3! 👑✨";
                icon = "🌟";
            } else if (score >= total * 0.8) {
                feedback = "RẤT TUYỆT VỜI! Kiến thức Units 1, 2, 3 của bạn rất vững chắc! 🎉";
                icon = "🔥";
            } else if (score >= total * 0.5) {
                feedback = "KHÁ TỐT! Hãy kiểm tra lại các câu sai bên dưới để rút kinh nghiệm nhé! 💪";
                icon = "👏";
            } else {
                feedback = "CỐ GẮNG THÊM NHÉ! Hãy đọc thật kỹ lời giải chi tiết của Ms Ngoc Hai FTU để ôn tập lại kiến thức nhé! 📚";
                icon = "🌱";
            }

            document.getElementById('feedbackText').innerText = feedback;
            document.getElementById('modalIcon').innerText = icon;
            document.getElementById('scoreModal').classList.add('active');
        });

        function reviewWrongAnswers() {
            document.getElementById('scoreModal').classList.remove('active');
            filterQuestionsResult('wrong');
        }

        function reviewAllAnswers() {
            document.getElementById('scoreModal').classList.remove('active');
            filterQuestionsResult('all');
        }

        function filterQuestionsResult(type) {
            const cards = document.querySelectorAll('.question-card');
            const btnAll = document.getElementById('btnFilterAll');
            const btnWrong = document.getElementById('btnFilterWrong');

            if (type === 'wrong') {
                btnWrong.classList.add('active');
                btnAll.classList.remove('active');
                cards.forEach(c => {
                    if (c.dataset.result === 'wrong') {
                        c.classList.remove('hidden');
                    } else {
                        c.classList.add('hidden');
                    }
                });
            } else {
                btnAll.classList.add('active');
                btnWrong.classList.remove('active');
                cards.forEach(c => c.classList.remove('hidden'));
            }
            updateTotalVisibleCount();
        }

        window.onload = () => {
            renderQuiz();
        };
    </script>
</body>
</html>
